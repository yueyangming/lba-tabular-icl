[project]
name = "lba-tabular-icl"
version = "1.0.0"
description = "Reference implementation for Local Bayes Advantage and selective retrieval in tabular in-context learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.52.0",
  "diskcache>=5.6.3",
  "lightgbm>=4.6.0",
  "matplotlib>=3.10.8",
  "numpy>=2.0.0",
  "openai>=2.0.0",
  "openml>=0.15.1",
  "pandas>=2.2.3",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.2",
  "scipy>=1.14.0",
  "scikit-learn>=1.7.1",
  "tenacity>=9.1.2",
  "xgboost>=3.0.0",
]

[project.optional-dependencies]
modern-baselines = [
  "catboost>=1.2.8",
  "tabpfn>=2.0.0",
  "tabicl>=0.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
lba-icl = "rail.experiments.run_icl_smoke:main"
lba-build-artifacts = "rail.analysis.build_paper_artifacts:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
